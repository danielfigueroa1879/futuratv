# Publica la versión para el navegador (carpeta app/) en GitHub Pages cada vez que cambia main.
# Requiere Settings → Pages → Source: «GitHub Actions» (activado). Dirección: https://danielfigueroa1879.github.io/futuratv/
name: Versión web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
